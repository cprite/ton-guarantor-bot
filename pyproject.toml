[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ton-guarantor-bot"
version = "1.0.0"
description = "Self-hosted escrow (guarantor) bot for TON deals on Telegram"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["ton", "telegram", "escrow", "bot", "nft", "jetton", "blockchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "aiogram>=3.15,<4",
    "tonutils>=2.3,<3",
    "aiosqlite>=0.20",
    "aiohttp>=3.9",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
guarantor = "guarantor.cli:main"

[project.urls]
Homepage = "https://github.com/cprite/ton-guarantor-bot"
Issues = "https://github.com/cprite/ton-guarantor-bot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/guarantor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# The tests import shared fixtures as `tests.conftest`, so the repo root has to
# be importable. `python -m pytest` adds it via the working directory; the bare
# `pytest` entry point does not, which is what CI runs.
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003 flag Cyrillic letters as "ambiguous"; this project ships a
# Russian locale, so they would fire on every translated string.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["guarantor"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
